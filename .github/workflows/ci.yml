name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Split-CI coverage policy (Phase 4, mirroring the go-asmgen org).
#
# A single `go test -coverpkg` run cannot reach 100% statement coverage over a
# package whose kernels are per-arch: each arch's wrappers only exist and run on
# that arch, so no single run covers them all. The honest fix, used here:
#   * The pure-Go CORE is held to 100% statement coverage by the `test` gate
#     below, on the GitHub-hosted amd64 AND arm64 runners; nothing is excluded
#     that a per-arch job does not run.
#   * The generated Plan 9 assembly carries no Go statements, so it cannot be
#     "covered" by the statement gate. It is instead validated by the per-arch
#     execution jobs (arch-native): each regenerates the committed .s with
#     go-asmgen, fails if it is stale, vets it (asmdecl cross-checks every
#     name+offset(FP)), builds it (cmd/asm encodes/validates the mnemonics),
#     and RUNS the test suite.
#   * The qemu-user jobs (arch-qemu) run the whole suite on the targets with no
#     hosted runner (riscv64, loong64, ppc64le, s390x), which ship no assembly
#     of their own here: the endianness and word-size guard.
#
# So every line is either statement-covered by the gate or executed by a
# per-arch job; the gate is never lowered and there is no coverage-gaming knob.
#
# The pointwise complex product of Bluestein's chirp and spectral products is
# not here: it is go-simd/floats' CMulTo, the one implementation, tested and
# regenerated in that module.
jobs:
  # Pure-Go coverage gate: build, vet, race-test, enforce 100% statement
  # coverage of the portable core. Runs on amd64 (ubuntu/windows) and arm64
  # (macos), so each host compiles and exercises its own arch's code — the gate
  # reaches 100% without excluding any reachable line.
  #
  # Sharding (shard_test.go): the Windows race lane is too slow in one piece (367 s
  # to a 600 s timeout on the same code), so it runs as three deterministic shards
  # of the root package's tests (GOFFT_SHARD=i/N, a name hash), each leaving at
  # least 30% of the timeout. A shard sees a third of the tests, so it cannot hold
  # the 100% gate: the gate runs on the UNSHARDED ubuntu (amd64) and ubuntu-24.04-arm
  # (arm64) lanes, the two that each compile a different arch's code, and
  # Windows (amd64, the same code as ubuntu) and macOS (arm64, the same code
  # as ubuntu-arm) run their shards under -race without it. macOS was unsharded
  # with the gate and reached its job limit twice (402 s of the suite alone, then
  # a cancellation after the FFTReal change); two shards leave it about half of
  # the time.
  test:
    name: test (${{ matrix.os }}${{ matrix.shard != '' && format(', shard {0}', matrix.shard) || '' }})
    runs-on: ${{ matrix.os }}
    env:
      GOFFT_SHARD: ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    shard: '' }
          - { os: ubuntu-24.04-arm, shard: '' }
          - { os: macos-latest,   shard: '0/2' }
          - { os: macos-latest,   shard: '1/2' }
          - { os: windows-latest, shard: '0/3' }
          - { os: windows-latest, shard: '1/3' }
          - { os: windows-latest, shard: '2/3' }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      - run: go version
      # Not on Windows: its checkout converts line endings to CRLF, and gofmt
      # then flags every file. Formatting does not depend on the OS.
      - name: gofmt
        if: runner.os != 'Windows'
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          [ -z "$unformatted" ] || { echo "::error::not gofmt-formatted:"; echo "$unformatted"; exit 1; }
      - run: go vet ./...
      - run: go build ./...
      - name: Test (race, one shard of the root package)
        if: matrix.shard != ''
        shell: bash
        run: go test -race ./...
      - name: Test + 100% coverage gate
        if: matrix.shard == ''
        shell: bash
        env:
          # TestDCT23Generated regenerates the DCT kernels (about a minute of CPU):
          # one lane does it, the others skip it with a logged reason.
          GOFFT_GEN_TEST: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}
        run: |
          COVERPKG=$(go list ./... | paste -sd, -)
          # The gates run without -race: with it the arm64 lane took 577 s and the
          # amd64 one 562 s of the 600 s go test timeout. -race runs on every shard
          # (Windows amd64, macOS arm64), so both architectures keep it.
          go test -coverpkg="$COVERPKG" -coverprofile=cover.out ./...
          go tool cover -func=cover.out | tail -n 25
          cov=$(go tool cover -func=cover.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "coverage: ${cov}%"
          awk -v t="$cov" 'BEGIN { exit !(t+0 >= 100.0) }' || {
            echo "::error::coverage ${cov}% < 100%"; exit 1; }
      # When the gate fails, name the blocks it missed: the percentage alone says
      # a runner's CPU left code uncovered, not which code (go-fft/fft#177).
      - name: Name the uncovered blocks
        if: failure() && matrix.shard == ''
        continue-on-error: true
        shell: bash
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install github.com/go-fleettools/fleettools/cmd/covblocks@v0.138.0
          "$RUNNER_TEMP/bin/covblocks" cover.out

  # Security: known vulnerabilities reachable from this module (govulncheck,
  # pinned; it fails only when vulnerable code is actually called), and a short
  # fuzz run of the public API, whose only allowed panics are the package's own
  # "fft: ..." messages (see validation_test.go).
  security:
    name: govulncheck + fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Fuzz the public API for 60 s
        run: go test -run '^$' -fuzz '^FuzzPublicAPI$' -fuzztime 60s .
      - name: Fuzz the FMA and scalar variants for 20 s each
        run: |
          go test -run '^$' -fuzz '^FuzzPublicAPIFMA$' -fuzztime 20s .
          go test -run '^$' -fuzz '^FuzzPublicAPIScalar$' -fuzztime 20s . || test "$(go env GOARCH)" != amd64

  # Native per-arch execution. amd64/arm64 have GitHub-hosted runners, so the
  # generated assembly (where present) runs natively. Each job regenerates the
  # committed .s via go-asmgen and fails if it is stale, then vets/builds/runs
  # the suite.
  arch-native:
    name: arch ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    label: amd64, regen: amd64 }
          - { os: ubuntu-24.04-arm, label: arm64, regen: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      - run: go env GOARCH
      - name: Regenerate committed assembly and check it is current
        if: matrix.regen != ''
        run: |
          GOFLAGS=-mod=mod go -C internal/kernels/asmgen/${{ matrix.regen }} run gen.go
          # Every file the generator writes is committed under internal/kernels:
          # move them ALL back and compare them all. Naming files here let one
          # through unchecked (cpu_amd64.s, the CPU and vendor probes, was never
          # compared until 2026-10-04), and a generated file nobody committed
          # would have stayed behind unseen.
          for f in internal/kernels/asmgen/${{ matrix.regen }}/*.s; do
            mv "$f" internal/kernels/
          done
          git diff --exit-code -- 'internal/kernels/*.s' || {
            echo "::error::generated ${{ matrix.regen }} assembly is stale; run go generate and commit"; exit 1; }
          if [ -n "$(git status --porcelain -- internal/kernels)" ]; then
            git status --porcelain -- internal/kernels
            echo "::error::the ${{ matrix.regen }} generator wrote files that are not committed"; exit 1
          fi
      - name: Regenerate the fused DCT-IV(64) kernels and check they are current
        run: |
          go run internal/gendct4/main.go internal/gendct4/amd64.go internal/gendct4/amd64f32.go
          git diff --exit-code -- dct4_64_gen.go dct4_64_gen_arm64.go dct4_64_arm64.s dct4_128_gen.go dct4_128_gen_arm64.go dct4_128_arm64.s dct4_64_gen_amd64.go dct4_64_amd64.s dct4_64_gen32_amd64.go dct4_64_f32_amd64.s || {
            echo "::error::the fused DCT-IV(64) kernels are stale; run go generate and commit"; exit 1; }
          if [ -n "$(git status --porcelain -- 'dct4_*_gen*.go' 'dct4_*_arm64.s')" ]; then
            git status --porcelain -- 'dct4_*_gen*.go' 'dct4_*_arm64.s'
            echo "::error::the DCT-IV(64) generator wrote files that are not committed"; exit 1
          fi
      - name: Regenerate the fused complex128 (256, 1024, 2048) and complex64 (64 to 16384) kernels and check they are current
        run: |
          go run internal/genfused256/main.go
          git diff --exit-code -- 'internal/kernels/fused*' || {
            echo "::error::the fused kernels are stale; run go generate and commit"; exit 1; }
          if [ -n "$(git status --porcelain -- 'internal/kernels/fused*')" ]; then
            git status --porcelain -- 'internal/kernels/fused*'
            echo "::error::the fused kernel generator wrote a file that is not committed"; exit 1
          fi
      - name: Vet (asmdecl) + build + run (SIMD == scalar)
        run: |
          go vet ./...
          go build ./...
          go test ./...
      - name: Shuffled test run (the seed is printed; reproduce with -shuffle=SEED)
        # Test order must not matter: a test that overrides a routing table and
        # leaves a plan in a cache fails the golden digests of whichever test
        # runs next (#139). `go test -shuffle=on` prints "-test.shuffle SEED".
        run: |
          echo "::notice::shuffled run; on a failure, reproduce with: go test -count=1 -shuffle=<the seed printed below> ."
          go test -count=1 -shuffle=on .

  # qemu-user execution for the targets without a hosted runner. None ships
  # generated assembly here (the portable Go path runs), so this job is the
  # endianness (s390x is the project's only big-endian target) and word-size
  # guard.
  arch-qemu:
    name: arch ${{ matrix.goarch }} (qemu${{ matrix.shard != '' && format(', shard {0}', matrix.shard) || '' }})
    # The suite takes 366 to 598 s on ppc64le against the 10-minute go test
    # timeout, so the slow targets run as deterministic shards (GOFFT_SHARD=i/N,
    # see shard_test.go): the full suite, no -short, no larger timeout.
    env:
      GOFFT_SHARD: ${{ matrix.shard }}
    # Not pinned: the install step below takes qemu-user (dynamic qemu-<arch>),
    # which exists on 24.04 and on 26.04 alike, and the test step accepts both
    # the -static and the plain name. A pin to ubuntu-24.04 only postponed the
    # break (qemu-user-static is virtual on 26.04) and Renovate bumped it.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goarch: riscv64, qemu: qemu-riscv64-static, shard: '' }
          - { goarch: loong64, qemu: qemu-loongarch64-static, shard: '0/2' }
          - { goarch: loong64, qemu: qemu-loongarch64-static, shard: '1/2' }
          - { goarch: ppc64le, qemu: qemu-ppc64le-static, shard: '0/3' }
          - { goarch: ppc64le, qemu: qemu-ppc64le-static, shard: '1/3' }
          - { goarch: ppc64le, qemu: qemu-ppc64le-static, shard: '2/3' }
          - { goarch: s390x,   qemu: qemu-s390x-static, shard: '0/3' }
          - { goarch: s390x,   qemu: qemu-s390x-static, shard: '1/3' }
          - { goarch: s390x,   qemu: qemu-s390x-static, shard: '2/3' }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      # ⛔ `qemu-user-static` is a VIRTUAL package on Ubuntu 26.04, which
      # `ubuntu-latest` became on 2026-10-19, and apt refuses to choose between its
      # two providers:
      #
      #   E: Package 'qemu-user-static' has no installation candidate
      #
      # ⚠ Installing a provider is NOT the fix: `qemu-user-binfmt` registers binfmt
      # handlers, it does not ship the `qemu-<arch>-static` binaries this lane
      # invokes. `qemu-user` ships the dynamic `qemu-<arch>`, which is all that
      # `go test -exec` needs, so both are installed and BOTH NAMES are accepted
      # below. go-tex/engine#645 has the full account.
      - name: install qemu user-mode emulators
        timeout-minutes: 10
        run: sudo apt-get update && sudo apt-get install -y qemu-user qemu-user-binfmt
      - name: Vet + test under qemu (${{ matrix.goarch }})
        run: |
          base="${{ matrix.qemu }}"
          q=""
          for cand in "$base" "${base%-static}"; do
            command -v "$cand" >/dev/null 2>&1 && q="$cand" && break
          done
          # ⛔ A missing emulator FAILS this lane. A lane that reports success for
          # an architecture it never ran is the one outcome this matrix exists to
          # rule out.
          if [ -z "$q" ]; then
            echo "::error::no qemu user emulator for ${{ matrix.goarch }} (looked for $base and ${base%-static})"
            exit 1
          fi
          # Printed on purpose: without it, "ran under emulation" and "skipped" are
          # indistinguishable from a green tick.
          echo "running ${{ matrix.goarch }} under $q"
          GOARCH=${{ matrix.goarch }} go test -exec="$q" ./...

  # A 32-bit lane for the length guards: math.MaxInt is 2^31-1 there, so the
  # guard's bound and the size arithmetic behind it are different numbers. The
  # root package's own tests compile for 386 (their absurd sizes are big32,
  # big40 and big62, bigint_test.go) and run here too, next to
  # internal/guardtest, the black-box suite. linux/386 binaries run natively on
  # the amd64 runner.
  arch-386:
    name: arch 386 (32-bit guards)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      - name: Vet + test the length guards on 386
        run: |
          GOARCH=386 go build ./...
          GOARCH=386 go vet ./internal/guardtest/
          GOARCH=386 go test -count=1 -v ./internal/guardtest/
      - name: Vet + test the root package on 386
        run: |
          GOARCH=386 go vet .
          GOARCH=386 go test -count=1 .

  # refbench CI mode (go-scikit/roadmap#27, W3): the allocation count of every
  # case equals docs/perf.json, docs/perf-table.md is what perf.json generates,
  # and every public function has a case or an entry in docs/perf-exempt.md.
  # One core is required (-cpu 1 or GOMAXPROCS=1); parallel.go reads GOMAXPROCS
  # when a transform runs (go-fft/fft#107), so either is honoured.
  # Timing runs by hand at a 1-minute load below 8:
  #   cd bench && GOMAXPROCS=1 go test -run TestPerf -cpu 1 -perf.run .
  perf:
    name: perf (refbench CI mode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      - name: Allocation counts, table, public-function inventory
        working-directory: bench
        env:
          GOMAXPROCS: '1'
        run: go test -count=1 -run TestPerf -cpu 1 .

  # The modules no other job compiles: the by-hand measurement harness
  # (benchmarks), the archived measurement scripts of the results directories,
  # and the generator modules (asmgen, whose tools.go carries the `tools` tag,
  # and asmgen/amd64). They are run by hand, so this only keeps them
  # compiling and vetted.
  modules:
    name: vet the by-hand modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      - name: benchmarks
        working-directory: benchmarks
        run: go vet ./...
      - name: archived probe script (round 20)
        working-directory: benchmarks/results/round20-cascade-large-20261005/scripts/probe
        run: go vet ./...
      - name: archived znan script (round 32)
        working-directory: benchmarks/results/round32-zen3-small-20261009/scripts/znan
        run: go vet ./...
      - name: archived znparity script (round 32)
        working-directory: benchmarks/results/round32-zen3-small-20261009/scripts/znparity
        run: go vet ./...
      - name: asmgen module (with its tools pin)
        working-directory: internal/kernels/asmgen
        run: go vet -tags tools ./...
      - name: asmgen amd64 generator module
        working-directory: internal/kernels/asmgen/amd64
        run: go vet ./...
