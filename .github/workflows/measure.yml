name: measure-test-times
# Throwaway (never merged): per-test durations of the CI test command on the
# three hosted OSes, as go test -json, uploaded as artifacts.
on:
  push:
    branches: [ci-test-time-measure]
permissions:
  contents: read
jobs:
  measure:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      - name: test -json
        shell: bash
        run: |
          COVERPKG=$(go list ./... | paste -sd, -)
          go test -race -json -timeout 40m -coverpkg="$COVERPKG" -coverprofile=cover.out ./... > test.json || true
          go tool cover -func=cover.out > cover.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: times-${{ matrix.os }}
          path: |
            test.json
            cover.txt
